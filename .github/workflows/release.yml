name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write # push the version commit / tags
  pull-requests: write # open the "Version Packages" PR
  id-token: write # npm trusted publishing (OIDC) + provenance

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          version: 9
          run_install: false

      # No registry-url: it writes an .npmrc with a placeholder token that
      # would be used instead of the OIDC trusted publisher.
      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      # Trusted publishing needs npm >= 11.5.1. Stay on 11: pnpm passes its own
      # --no-git-checks flag through to `npm publish`, which npm 12 rejects.
      - name: Update npm
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          # Builds and runs `changeset publish`
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
